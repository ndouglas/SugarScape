name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -p sugarscape-core
      - run: cargo test -p sugarscape-core --release --test book -- --ignored
      - run: cargo build -p sugarscape-core --target wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pinned: "latest" silently falls back to v0.9.1 when the release lookup
          # fails, and v0.9.1 cannot read workspace-inherited Cargo.toml fields.
          version: v0.15.0
      - run: wasm-pack test --node crates/sugarscape-wasm

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pinned: "latest" silently falls back to v0.9.1 when the release lookup
          # fails, and v0.9.1 cannot read workspace-inherited Cargo.toml fields.
          version: v0.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
