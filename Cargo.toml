[workspace]
resolver = "2"
members = ["crates/sugarscape-core", "crates/sugarscape-wasm", "crates/sugarscape-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rand = { version = "0.8", default-features = false, features = ["alloc"] }
rand_pcg = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"

[profile.release]
lto = true
opt-level = 3
