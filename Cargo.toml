[workspace]
resolver = "2"
members = ["crates/sugarscape-core", "crates/sugarscape-wasm", "crates/sugarscape-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rand = { version = "0.8", default-features = false, features = ["alloc"] }
rand_pcg = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"

[profile.release]
lto = true
opt-level = 3

# Tests step whole worlds for hundreds of ticks; unoptimized they run 10–30× slower.
# Optimize them but keep the checks debug builds give: overflow and debug assertions stay on.
# Floating-point results don't depend on the optimization level, so fingerprints are unchanged.
[profile.test]
opt-level = 3
debug-assertions = true
overflow-checks = true
debug = "line-tables-only"
